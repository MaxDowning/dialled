<title>Dialled</title>
<style>
:root{
  --bg:#0a0a0c;--bg2:#111114;--panel:rgba(20,20,24,.85);--panel2:rgba(26,26,31,.7);
  --accent:#ff5a1f;--accent2:#ffb347;--green:#3ddc84;--red:#ff5468;--text:#f2f1ee;--muted:#8a8a92;
  --line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.04);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1a1410 0,#0a0a0c 40%,#000 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:rgba(8,8,10,.75);backdrop-filter:blur(14px);padding:20px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{font-size:26px;font-weight:900;letter-spacing:2px;color:var(--accent);text-shadow:0 0 20px rgba(255,90,31,.35)}
.sub{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.nav{display:grid;gap:8px;margin-top:26px;flex:1;align-content:start}
.nav button{width:100%;text-align:left}
.nav button.active{border-color:rgba(255,90,31,.6);background:rgba(255,90,31,.14);box-shadow:0 0 20px rgba(255,90,31,.1)}
.status{padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}
.main{padding:22px;max-width:1200px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.title{font-size:26px;font-weight:800;letter-spacing:2px;color:var(--accent)}
.time{font-size:13px;color:var(--muted)}
.panel{border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),rgba(10,10,12,.7));border-radius:20px;padding:18px;box-shadow:0 0 30px rgba(0,0,0,.35);position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5}
.panel h2,.panel h3{margin:0 0 12px;color:var(--accent);letter-spacing:.5px}
.muted{color:var(--muted)}
.small{font-size:12px}
.grid{display:grid;gap:14px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.four{grid-template-columns:repeat(4,1fr)}
.metric{padding:13px;background:var(--glass);border:1px solid rgba(255,255,255,.06);border-radius:14px}
.metric .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px}
.metric .value{font-size:22px;color:var(--text);font-weight:800;margin-top:4px}
.btn{border:1px solid var(--line);background:linear-gradient(90deg,rgba(255,90,31,.14),rgba(255,179,71,.08));color:var(--text);padding:11px 15px;border-radius:12px;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,90,31,.5);box-shadow:0 0 18px rgba(255,90,31,.12)}
.btn.full{width:100%}
.btn.green{border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.1)}
.btn.red{border-color:rgba(255,84,104,.35);background:rgba(255,84,104,.1)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.space{height:14px}
.note{border-left:3px solid var(--accent);padding:9px 12px;background:rgba(255,90,31,.06);border-radius:10px;margin:7px 0}
.form{display:grid;gap:9px}
.form input,.form select,.form textarea{width:100%;padding:10px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);outline:none}
.exercise{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);border-radius:16px;padding:14px;margin:10px 0}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-weight:700;font-size:15px}
.ex-meta{color:var(--muted);font-size:12px;margin-top:3px}
.ex-tip{display:inline-block;margin-top:6px;padding:4px 9px;border-radius:999px;background:rgba(255,90,31,.12);border:1px solid rgba(255,90,31,.3);color:var(--accent2);font-size:11px;font-weight:600}
.ex-progress{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0}
.ex-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .2s}
.sets{display:grid;gap:8px}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr auto auto;gap:7px;align-items:center;background:rgba(255,255,255,.02);border-radius:10px;padding:6px;transition:background .2s}
.set-row.done{background:rgba(61,220,132,.08)}
.set-num{color:var(--muted);font-size:12px;text-align:center;font-weight:700}
.field{position:relative}
.field input{width:100%;padding:10px 34px 10px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);outline:none;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.field input::placeholder{font-size:13px;font-weight:500;color:var(--muted)}
.field input:focus{border-color:rgba(255,90,31,.6);box-shadow:0 0 0 3px rgba(255,90,31,.14)}
.field .unit{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;pointer-events:none}
.set-row.done .field .unit{color:var(--green)}
.set-del{background:transparent;border:1px solid rgba(255,84,104,.3);color:var(--red);padding:0;width:34px;height:34px;min-height:34px;border-radius:9px;font-size:15px;line-height:1}
.btn.rest-btn{padding:8px 10px;min-height:34px;font-size:11px;white-space:nowrap}
.rest-fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0a0a0c;font-weight:800;padding:12px 22px;border-radius:999px;box-shadow:0 6px 26px rgba(255,90,31,.4);border:none}
.template-list{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
@media(max-width:850px){
  .template-list{grid-template-columns:repeat(2,1fr)}
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;padding:12px 14px;flex-direction:row;align-items:center;gap:14px;z-index:5;border-right:none;border-bottom:1px solid var(--line)}
  .side .brand{font-size:20px}
  .side .sub{display:none}
  .side .status{display:none}
  .nav{margin-top:0;display:flex;flex:1;overflow-x:auto;gap:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .nav button{white-space:nowrap;width:auto;padding:10px 14px}
  .main{padding:14px}
  .two,.three,.four{grid-template-columns:1fr}
  .set-row{grid-template-columns:20px 1fr 1fr auto auto;padding:8px 6px}
  .field input{font-size:15px;padding:9px 30px 9px 10px}
  .rest-fab{padding:11px 18px;font-size:14px}
  .topbar{flex-wrap:wrap}
  .title{font-size:20px}
}
button,.btn{min-height:44px}
input,select,textarea{min-height:44px}

.ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p),rgba(255,255,255,.07) 0);position:relative}
.ring:after{content:"";position:absolute;inset:9px;background:#0c0c0e;border-radius:50%}
.ring span{position:relative;z-index:1;font-weight:800;font-size:14px}
.mini-bars{display:grid;gap:7px}
.mini-row{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center}
.heat{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.heat i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
canvas{width:100%;height:200px;background:rgba(0,0,0,.2);border-radius:12px}
.bull{color:var(--green)}
.bear{color:var(--red)}
.wide-input{width:100%}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{width:min(420px,100%);padding:32px;border:1px solid var(--line);background:linear-gradient(150deg,rgba(20,20,24,.9),rgba(6,6,8,.9));box-shadow:0 0 60px rgba(255,90,31,.1);border-radius:24px;text-align:center}
.dpass{margin:24px 0 12px;width:100%;padding:14px 16px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;color:var(--text);outline:none;text-align:center;font-size:20px;letter-spacing:8px}
</style>
</head>
<body>

<section id="app" class="app">
  <aside class="side">
    <div class="brand">DIALLED</div>
    <div class="sub">Gym Coach</div>
    <div class="nav" id="nav"></div>
    <div class="status">Data saved locally on this device.</div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
  <button id="restFab" class="rest-fab hidden" onclick="clearInterval(restTimer);restFab.classList.add('hidden')"></button>
</section>

],
'Leg + Abs Day':[

],

const pages=['Gym','Exercise Analytics','Goals','Achievements','Settings'];
let state=JSON.parse(localStorage.dialled||'{}');
state.workouts ||= [];
state.goals ||= [];
let currentPage='Gym', activeWorkout=null, restTimer=null, restEnd=0;

function save(){localStorage.dialled=JSON.stringify(state)}

init();

function init(){renderNav();show('Gym')}
function renderNav(){nav.innerHTML=pages.map(p=>`<button class="btn ${p===currentPage?'active':''}" onclick="show('${p}')">${p}</button>`).join('')}
function show(p){currentPage=p;renderNav();({
  Gym:renderGym,'Exercise Analytics':renderExerciseAnalytics,Goals:renderGoals,Achievements:renderAchievements,Settings:renderSettings
}[p])()}

function todayName(){return split[new Date().getDay()]}
function allSets(ex){return state.workouts.flatMap(w=>w.exercises||[]).filter(e=>e.name===ex).flatMap(e=>e.sets||[])}
function bestSet(ex){let sets=allSets(ex).filter(s=>s.weight&&s.reps);return sets.sort((a,b)=>(b.weight*b.reps)-(a.weight*a.reps))[0]}
function est1rm(w,r){return Math.round(w*(1+r/30)*10)/10}
// --- Progressive overload logic (unchanged from source) ---
function suggest(name,range){let b=bestSet(name);if(!b)return 'Set baseline today';let top=Number((range.split('-')[1]||range).trim());return b.reps>=top?`Try ${Number(b.weight)+2.5}kg`:`Repeat ${b.weight}kg and beat ${b.reps} reps`}

function muscleForExercise(name){for(const day of Object.values(templates)){for(const e of day){if(e[0]===name)return e[3]}}return 'Other'}
function muscleList(){return ['Chest','Back','Shoulders','Rear delts','Triceps','Biceps','Quads','Hamstrings','Calves','Adductors','Abs']}
function daysSince(date){return Math.floor((Date.now()-new Date(date).getTime())/86400000)}
function muscleRecovery(){let out={};muscleList().forEach(m=>out[m]=100);for(const w of state.workouts){const age=daysSince(w.date);for(const e of w.exercises||[]){const m=e.muscle||muscleForExercise(e.name);const sets=(e.sets||[]).filter(s=>s.weight&&s.reps).length;const strain=Math.min(65,sets*9);const rec=Math.min(100,Math.round(age*28));out[m]=Math.min(out[m]??100,Math.max(35,100-strain+rec));}}return out}
function recoveryBars(rec){return `<div class="mini-bars">${Object.entries(rec).map(([m,v])=>`<div class="mini-row"><span class="muted small">${m}</span><div class="heat"><i style="width:${v}%"></i></div><b>${v}%</b></div>`).join('')}</div>`}
function recoveryRecommendation(rec){let low=Object.entries(rec).sort((a,b)=>a[1]-b[1])[0];return low[1]<65?`${low[0]} is still recovering. Avoid max-effort work for that area today.`:'Recovery looks good. Train the scheduled session with normal progression.'}

function weeklyWorkouts(){let cutoff=Date.now()-7*86400000;return state.workouts.filter(w=>new Date(w.date).getTime()>=cutoff)}
function totalVolume(ws=state.workouts){return ws.reduce((a,w)=>a+workoutVolume(w),0)}
function totalSets(ws=state.workouts){return ws.flatMap(w=>w.exercises||[]).flatMap(e=>e.sets||[]).filter(s=>s.weight&&s.reps).length}
function workoutVolume(w){return (w.exercises||[]).flatMap(e=>e.sets||[]).reduce((a,s)=>a+(Number(s.weight)||0)*(Number(s.reps)||0),0)}
function bestLiftOverall(){let best=null;for(const w of state.workouts){for(const e of w.exercises||[]){for(const s of e.sets||[]){if(s.weight&&s.reps){let score=Number(s.weight)*Number(s.reps);if(!best||score>best.score)best={exercise:e.name,weight:s.weight,reps:s.reps,score}}}}}return best}
function bodyWeightTrend(){let weights=state.workouts.filter(w=>w.bodyweight).map(w=>({date:w.date,weight:Number(w.bodyweight)})).filter(x=>x.weight);if(weights.length<2)return null;let last=weights.at(-1), prev=weights.length>=5?weights.at(-5):weights.at(-2);return {current:last.weight,change:Math.round((last.weight-prev.weight)*10)/10}}
function nextLiftRecommendation(workoutName){if(workoutName==='Rest'||!templates[workoutName])return null;for(let t of templates[workoutName]){let name=t[0], range=t[2], b=bestSet(name);if(b){return {exercise:name,text:suggest(name,range)}}}return {exercise:templates[workoutName][0][0],text:'Set baseline today'}}
function nextProgressionCard(){const today=todayName();if(today==='Rest')return '<div class="note">Rest day. Dialled recommends recovery and a weekly review.</div>';return templates[today].slice(0,3).map(e=>`<div class="note"><b>${e[0]}</b><br><span class="muted">${suggest(e[0],e[2])}</span></div>`).join('')}

function goalCard(g,i){let p=Math.min(100,Math.round((g.current/g.target)*100));return `<div class="metric"><div class="row" style="justify-content:space-between"><div class="row"><div class="ring" style="--p:${p}%"><span>${p}%</span></div><div><div class="label">${g.name}</div><div class="value">${g.current}/${g.target}${g.unit||''}</div></div></div><button class="btn red" onclick="deleteGoal(${i})">✕</button></div></div>`}

// --- Gym ---
function renderGym(){
  let today=todayName(), rec=muscleRecovery(), week=weeklyWorkouts();
  view.innerHTML=`
  <div class="grid two">
    <div class="panel"><h2>Today</h2>
      <div class="row"><div class="ring" style="--p:${today==='Rest'?100:68}"><span>${today==='Rest'?'REST':'GO'}</span></div>
      <div><h3>${today}</h3><div class="muted small">${today==='Rest'?'No scheduled lifting.':templates[today].length+' exercises programmed'}</div></div></div>
      <div class="space"></div>
      <div class="template-list">${Object.keys(templates).map(t=>`<button class="btn ${t===today?'green':''}" onclick="startWorkout('${t}')">${t}</button>`).join('')}</div>
    </div>
    <div class="panel"><h2>Coach</h2><div id="coach"></div></div>
  </div>
  <div class="space"></div>
  <div id="workoutArea"></div>
  <div class="space"></div>
  <div class="grid two">
    <div class="panel"><h2>Recovery</h2>${recoveryBars(rec)}<div class="space"></div><div class="note">${recoveryRecommendation(rec)}</div></div>
    <div class="panel"><h2>This Week</h2>
      <div class="grid three">
        <div class="metric"><div class="label">Workouts</div><div class="value">${week.length}</div></div>
        <div class="metric"><div class="label">Sets</div><div class="value">${totalSets(week)}</div></div>
        <div class="metric"><div class="label">Volume</div><div class="value">${Math.round(totalVolume(week)).toLocaleString()}kg</div></div>
      </div>
      <div class="space"></div>
      <canvas id="volumeCanvas" width="600" height="200"></canvas>
    </div>
  </div>
  <div class="space"></div>
  <div class="panel"><h2>History</h2><div id="history"></div></div>
  `;
  renderCoach();renderHistory();drawVolume();
}
function startWorkout(name){activeWorkout={id:Date.now(),name,date:new Date().toISOString(),bodyweight:'',exercises:templates[name].map(e=>({name:e[0],targetSets:e[1],reps:e[2],muscle:e[3],rest:e[4]||90,sets:Array.from({length:e[1]},()=>({weight:'',reps:''}))}))};renderWorkout()}
function lastSetsFor(name){for(let k=state.workouts.length-1;k>=0;k--){let e=(state.workouts[k].exercises||[]).find(x=>x.name===name);if(e&&(e.sets||[]).some(s=>s.weight&&s.reps))return e.sets.filter(s=>s.weight&&s.reps)}return []}
function renderWorkout(){workoutArea.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><div><h2>${activeWorkout.name}</h2><div class="muted small">Log all exercises in this one session.</div></div><button class="btn green" onclick="finishWorkout()">Finish Workout</button></div><div class="space"></div><div class="form"><input placeholder="Body weight kg (optional)" value="${activeWorkout.bodyweight}" oninput="activeWorkout.bodyweight=this.value"></div>${activeWorkout.exercises.map((ex,i)=>{let doneCount=ex.sets.filter(s=>s.weight&&s.reps).length;let pct=Math.min(100,Math.round(doneCount/Math.max(1,ex.targetSets)*100));let last=lastSetsFor(ex.name);return `<div class="exercise">
  <div class="ex-head">
    <div><div class="ex-name">${ex.name}</div><div class="ex-meta">Target ${ex.targetSets} sets · ${ex.reps} reps · ${Math.round((ex.rest||90)/60*10)/10}min rest</div><div class="ex-tip">${suggest(ex.name,ex.reps)}</div></div>
    <button class="btn" onclick="addSet(${i})">+ Set</button>
  </div>
  <div class="ex-progress"><i style="width:${pct}%"></i></div>
  <div class="sets">${ex.sets.map((s,j)=>{let lw=last[j]?.weight, lr=last[j]?.reps;return `<div class="set-row ${s.weight&&s.reps?'done':''}"><div class="set-num">${j+1}</div><div class="field"><input type="number" inputmode="decimal" placeholder="${lw??'0'}" value="${s.weight}" oninput="activeWorkout.exercises[${i}].sets[${j}].weight=this.value;updateSetVisual(${i},${j})"><span class="unit">kg</span></div><div class="field"><input type="number" inputmode="numeric" placeholder="${lr??'0'}" value="${s.reps}" oninput="activeWorkout.exercises[${i}].sets[${j}].reps=this.value;updateSetVisual(${i},${j})"><span class="unit">reps</span></div><button class="btn rest-btn" onclick="startRest(${ex.rest||90})">Rest</button><button class="set-del" onclick="deleteSet(${i},${j})" title="Remove set">✕</button></div>`}).join('')}</div>
</div>`}).join('')}</div>`}
function addSet(i){activeWorkout.exercises[i].sets.push({weight:'',reps:''});renderWorkout()}
function deleteSet(i,j){activeWorkout.exercises[i].sets.splice(j,1);renderWorkout()}
function updateSetVisual(i,j){
  let ex=activeWorkout.exercises[i], s=ex.sets[j];
  let exEl=document.querySelectorAll('.exercise')[i];
  if(!exEl)return;
  let row=exEl.querySelectorAll('.set-row')[j];
  if(row)row.classList.toggle('done',!!(s.weight&&s.reps));
  let doneCount=ex.sets.filter(x=>x.weight&&x.reps).length;
  let pct=Math.min(100,Math.round(doneCount/Math.max(1,ex.targetSets)*100));
  let bar=exEl.querySelector('.ex-progress i');
  if(bar)bar.style.width=pct+'%';
}
function startRest(sec){clearInterval(restTimer);restEnd=Date.now()+sec*1000;restFab.classList.remove('hidden');restFab.textContent=`Rest ${fmtTime(sec)} · tap to stop`;restTimer=setInterval(()=>{let left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));if(left){restFab.textContent=`Rest ${fmtTime(left)} · tap to stop`}else{restFab.textContent='Rest complete ✓';clearInterval(restTimer);setTimeout(()=>restFab.classList.add('hidden'),4000)}},250)}
function fmtTime(s){let m=Math.floor(s/60),r=s%60;return `${m}:${String(r).padStart(2,'0')}`}
function finishWorkout(){if(!activeWorkout)return;state.workouts.push(activeWorkout);save();activeWorkout=null;renderGym()}
function renderHistory(){history.innerHTML=state.workouts.slice(-10).reverse().map(w=>`<div class="note"><b>${w.name}</b> · ${new Date(w.date).toLocaleDateString()} · ${w.exercises.length} exercises · ${Math.round(workoutVolume(w)).toLocaleString()}kg</div>`).join('')||'<div class="muted">No workouts logged yet.</div>'}
function renderCoach(){let last=state.workouts.at(-1);if(!last){coach.innerHTML='<div class="muted">Log a workout and Dialled will analyse progression, PRs and next-session targets.</div>';return}coach.innerHTML=`<div class="note">Latest session: <b>${last.name}</b> with ${Math.round(workoutVolume(last)).toLocaleString()}kg total volume.</div><div class="note">Progression rule: if all sets reach the top of the rep range, increase next time. Otherwise repeat weight and add reps.</div>${nextProgressionCard()}`}
function drawVolume(){let c=document.getElementById('volumeCanvas');if(!c)return;let ctx=c.getContext('2d'), w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let data=state.workouts.slice(-8).map(workoutVolume);ctx.strokeStyle='rgba(255,90,31,.22)';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(30,20+i*36);ctx.lineTo(w-20,20+i*36);ctx.stroke()}if(data.length<2)return;let max=Math.max(...data,1);ctx.strokeStyle='#ff5a1f';ctx.lineWidth=3;ctx.beginPath();data.forEach((v,i)=>{let x=35+i*(w-70)/(data.length-1), y=h-25-(v/max)*(h-55);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();}

// --- Exercise Analytics ---
function exerciseNames(){return [...new Set(Object.values(templates).flat().map(x=>x[0]).concat(state.workouts.flatMap(w=>(w.exercises||[]).map(e=>e.name))))].sort()}
function renderExerciseAnalytics(){let names=exerciseNames();let selected=names[0]||'';let rec=muscleRecovery();view.innerHTML=`<div class="panel"><h2>Exercise Analytics</h2><select id="exSelect" class="wide-input" onchange="updateExerciseAnalytics(this.value)">${names.map(n=>`<option>${n}</option>`).join('')}</select><div class="space"></div><div id="exAnalytics"></div></div><div class="space"></div><div class="panel"><h2>Recovery Heatmap</h2>${recoveryBars(rec)}<div class="space"></div><div class="note">Dialled estimates recovery from the muscles trained, number of sets, and days since last session.</div><div class="note">Recommendation: ${recoveryRecommendation(rec)}</div></div>`;updateExerciseAnalytics(selected)}
function updateExerciseAnalytics(name){let sets=allSets(name).filter(s=>s.weight&&s.reps).map(s=>({weight:Number(s.weight),reps:Number(s.reps)}));let sessions=state.workouts.filter(w=>(w.exercises||[]).some(e=>e.name===name));let best=sets.sort((a,b)=>(b.weight*b.reps)-(a.weight*a.reps))[0];let max1rm=sets.length?Math.max(...sets.map(s=>est1rm(s.weight,s.reps))):0;let vol=sets.reduce((a,s)=>a+s.weight*s.reps,0);let last=sessions.at(-1);let prev=sessions.at(-2);let trend=prev&&last?Math.round((workoutVolume({exercises:last.exercises.filter(e=>e.name===name)})-workoutVolume({exercises:prev.exercises.filter(e=>e.name===name)}))/(Math.max(1,workoutVolume({exercises:prev.exercises.filter(e=>e.name===name)})))*100):0;exAnalytics.innerHTML=`<div class="grid four"><div class="metric"><div class="label">Sessions</div><div class="value">${sessions.length}</div></div><div class="metric"><div class="label">Best Set</div><div class="value">${best?best.weight+'×'+best.reps:'—'}</div></div><div class="metric"><div class="label">Est. 1RM</div><div class="value">${max1rm?max1rm+'kg':'—'}</div></div><div class="metric"><div class="label">Lifetime Volume</div><div class="value">${Math.round(vol).toLocaleString()}kg</div></div></div><div class="space"></div><div class="note">Trend versus previous session: <b class="${trend>=0?'bull':'bear'}">${trend>=0?'+':''}${trend}%</b>. ${sets.length?'Dialled will suggest progression when you hit the top of the programmed rep range.':'Log this exercise to activate analytics.'}</div><canvas id="exerciseCanvas" width="900" height="220"></canvas>`;drawExercise(name)}
function drawExercise(name){let c=document.getElementById('exerciseCanvas');if(!c)return;let ctx=c.getContext('2d'), w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let data=state.workouts.map(w=>{let e=(w.exercises||[]).find(x=>x.name===name);if(!e)return null;let best=(e.sets||[]).filter(s=>s.weight&&s.reps).map(s=>est1rm(Number(s.weight),Number(s.reps))).sort((a,b)=>b-a)[0];return best||null}).filter(Boolean);ctx.strokeStyle='rgba(255,90,31,.2)';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(30,20+i*40);ctx.lineTo(w-20,20+i*40);ctx.stroke()}if(data.length<2)return;let max=Math.max(...data,1), min=Math.min(...data,0);ctx.strokeStyle='#ff5a1f';ctx.lineWidth=3;ctx.beginPath();data.forEach((v,i)=>{let x=35+i*(w-70)/(data.length-1), y=h-25-((v-min)/(max-min||1))*(h-55);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}

// --- Goals ---
function renderGoals(){view.innerHTML=`<div class="panel"><h2>Goals</h2>${state.goals.length?`<div class="grid two">${state.goals.map((g,i)=>goalCard(g,i)).join('')}</div><div class="space"></div>`:'<div class="muted">No goals yet — add your first one below.</div><div class="space"></div>'}<div class="form"><input id="gName" placeholder="Goal name"><input id="gCurrent" type="number" placeholder="Current"><input id="gTarget" type="number" placeholder="Target"><input id="gUnit" placeholder="Unit (kg, reps...)"><button class="btn green" onclick="addGoal()">Add Goal</button></div></div>`}
function deleteGoal(i){if(confirm('Delete this goal?')){state.goals.splice(i,1);save();renderGoals()}}
function addGoal(){let name=gName.value.trim();if(!name)return;state.goals.push({name,current:Number(gCurrent.value)||0,target:Number(gTarget.value)||1,unit:gUnit.value.trim()});save();renderGoals()}

// --- Achievements ---
function achievementData(){let vol=totalVolume(), count=state.workouts.length, best=bestLiftOverall();return [{name:'First Workout',icon:'🏁',ok:count>=1},{name:'10 Workouts',icon:'🔥',ok:count>=10},{name:'100,000kg Lifted',icon:'🏗️',ok:vol>=100000},{name:'Full Week Completed',icon:'✅',ok:weeklyWorkouts().length>=5},{name:'100kg Hack Squat Logged',icon:'🦵',ok:allSets('Hack Squat').some(s=>Number(s.weight)>=100)},{name:'Goals Active',icon:'🎯',ok:state.goals.length>=3}]}
function renderAchievements(){view.innerHTML=`<div class="panel"><h2>Achievements</h2><div class="grid three">${achievementData().map(a=>`<div class="metric" style="opacity:${a.ok?1:.35}"><div style="font-size:26px">${a.icon}</div><div class="small">${a.name}</div></div>`).join('')}</div></div>`}

// --- Settings ---
function renderSettings(){view.innerHTML=`<div class="panel"><h2>Settings</h2><button class="btn" onclick="exportData()">Export Data</button> <button class="btn red" onclick="if(confirm('Clear all Dialled data?')){localStorage.removeItem('dialled');location.reload()}">Clear Data</button><div class="space"></div><textarea id="importBox" rows="8" placeholder="Paste exported JSON here" class="wide-input"></textarea><button class="btn" onclick="importData()">Import Data</button></div><div class="space"></div><div class="panel"><h2>Import Workout History</h2><p class="muted small">Paste logs like: 24/06/2026 - Push A, then exercise names and sets like 70 x 10.</p><textarea id="historyBox" rows="10" class="wide-input" placeholder="24/06/2026 - Push A
Incline Smith Bench Press
70 x 11
70 x 10"></textarea><div class="space"></div><button class="btn green" onclick="parseWorkoutHistory()">Import Workout Text</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dialled-backup.json';a.click()}
function importData(){try{state=JSON.parse(importBox.value);save();alert('Imported.');show('Gym')}catch(e){alert('Invalid JSON')}}
function parseWorkoutHistory(){let lines=historyBox.value.split(/\n/).map(x=>x.trim()).filter(Boolean), current=null, ex=null, added=0;for(let line of lines){let head=line.match(/^(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})\s*[-–]\s*(.+)$/);if(head){if(current){state.workouts.push(current);added++}let d=head[1].replace(/-/g,'/').split('/');let year=d[2].length===2?'20'+d[2]:d[2];current={id:Date.now()+added,name:head[2],date:new Date(`${year}-${d[1].padStart(2,'0')}-${d[0].padStart(2,'0')}`).toISOString(),bodyweight:'',exercises:[]};ex=null;continue}if(!current)continue;if(/^body\s*weight/i.test(line)){current.bodyweight=(line.match(/[\d.]+/)||[''])[0];continue}let set=line.match(/([\d.]+)\s*(?:kg)?\s*[x×]\s*(\d+)/i);if(set&&ex){ex.sets.push({weight:set[1],reps:set[2]});continue}ex={name:line,targetSets:0,reps:'',muscle:muscleForExercise(line),sets:[]};current.exercises.push(ex)}if(current){state.workouts.push(current);added++}save();alert(`Imported ${added} workout(s).`);show('Gym')}
</script>
